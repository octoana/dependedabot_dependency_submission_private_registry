name: Build and submit dependencies

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read
  id-token: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore from private feed
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
        run: dotnet restore src/PrivateFeedDemo/PrivateFeedDemo.csproj --configfile NuGet.Config
      - name: Build
        run: dotnet build src/PrivateFeedDemo/PrivateFeedDemo.csproj --configuration Release --no-restore
      - name: Exercise private package
        run: |
          dotnet run --project src/PrivateFeedDemo --configuration Release --no-build
          dotnet run --project src/PrivateFeedDemo --configuration Release --no-build -- --self-test
      - name: Submit resolved NuGet dependencies
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          filePath: src/PrivateFeedDemo
          detectorsCategories: NuGet
          fail-on-empty: 'true'
